# dsh-aidrama bundle patch: inserts the plugin row into the profile roster.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (settings section + project/stage/image/video routes), and
# the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/aidrama/client.js) load in the web GUI.
- insert:
    - id: aidrama
      name: dsh-aidrama
